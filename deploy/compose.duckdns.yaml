services:
  duckdns:
    image: node:24-alpine
    restart: unless-stopped
    user: node
    entrypoint: ['node', '/opt/punchin/duckdns.mjs']
    command: []
    env_file:
      - deploy/.env.duckdns
    volumes:
      - ./scripts/duckdns.mjs:/opt/punchin/duckdns.mjs:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
