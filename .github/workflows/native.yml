name: Native build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://attendance.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @punchin/employee build:native
      - run: pnpm --filter @punchin/employee exec cap sync android
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        working-directory: apps/employee/android
      - uses: actions/upload-artifact@v4
        with:
          name: punchin-android-debug
          path: apps/employee/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  ios-simulator:
    runs-on: macos-15
    env:
      VITE_API_BASE_URL: https://attendance.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @punchin/employee build:native
      - run: pnpm --filter @punchin/employee exec cap sync ios
      - run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/employee/ios/App
