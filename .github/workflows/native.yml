name: Native build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://attendance.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @punchin/employee build:native
      - run: pnpm --filter @punchin/employee exec cap sync android
      - name: Build Android debug and run unit tests
        run: |
          sed -i "s/gradle-8.14.3-bin.zip/gradle-8.14.3-bin.zip?run=$GITHUB_RUN_ID/" gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            ./gradlew assembleDebug testDebugUnitTest --no-daemon && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
        working-directory: apps/employee/android
      - uses: actions/upload-artifact@v4
        with:
          name: punchin-android-debug
          path: apps/employee/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  ios-simulator:
    runs-on: macos-15
    env:
      VITE_API_BASE_URL: https://attendance.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @punchin/employee build:native
      - run: pnpm --filter @punchin/employee exec cap sync ios
      - name: Cache verified Capacitor binary artifacts
        run: |
          cache="$RUNNER_TEMP/punchin-package-cache/artifacts"
          mkdir -p "$cache"
          base=https://github.com/ionic-team/capacitor-swift-pm/releases/download/8.6.0
          prefix=https___github_com_ionic_team_capacitor_swift_pm_releases_download_8_6_0
          curl --fail --location --connect-timeout 30 --max-time 180 --retry 3 --retry-all-errors "$base/Capacitor.xcframework.zip?run=$GITHUB_RUN_ID" -o "$cache/${prefix}_Capacitor_xcframework_zip"
          curl --fail --location --connect-timeout 30 --max-time 180 --retry 3 --retry-all-errors "$base/Cordova.xcframework.zip?run=$GITHUB_RUN_ID" -o "$cache/${prefix}_Cordova_xcframework_zip"
          echo "df2b77a471b939ce2d1b954cf11247714154bb5f91fa94901d3547e8fda314ad  $cache/${prefix}_Capacitor_xcframework_zip" | shasum -a 256 -c
          echo "150543647078664bd1e852574cec4a65d0a38c9d3c5a8a07740b17b07850d3f6  $cache/${prefix}_Cordova_xcframework_zip" | shasum -a 256 -c
      - name: Build iOS simulator
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/punchin-derived" -clonedSourcePackagesDirPath "$RUNNER_TEMP/punchin-packages" -packageCachePath "$RUNNER_TEMP/punchin-package-cache" CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/employee/ios/App
